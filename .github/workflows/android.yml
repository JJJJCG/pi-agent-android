name: Android CI

# 什么时候跑：
#   · push 到主分支
#   · 打 v 开头的标签（会发正式 Release，而不是 nightly）
#   · 提 PR
#   · 手动点一下就跑（Actions 页面上的 Run workflow）
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 同一条分支上的旧任务自动取消，别浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 构建本身只读；发 Release 那一步单独要写权限
permissions:
  contents: read

jobs:
  build-debug:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      # 端侧资源（so + onnx 模型）已经入库；万一被清掉了或换成别处拉，
      # 这一步会在缺失时自动补上，不会静默编出一个没有语音能力的 APK。
      - name: 确认端侧语音资源就位
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() { [ -e "$1" ] || { echo "缺少：$1"; missing=1; }; }
          check app/src/main/assets/silero_vad.onnx
          check app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          check app/src/main/assets/kws/tokens.txt
          ls app/src/main/assets/kws/encoder*.onnx >/dev/null 2>&1 || { echo "缺少：encoder*.onnx"; missing=1; }

          if [ "$missing" -eq 1 ]; then
            echo "::group::联网拉取端侧资源"
            python3 tools/fetch_assets.py --abis arm64-v8a
            echo "::endgroup::"
          else
            echo "资源齐备，跳过下载。"
          fi

      # 只借它做依赖缓存与构建扫描上报；Gradle 版本以仓库里的 wrapper 为准
      # （不设 gradle-version，否则会多下一份同版本的发行包，纯属浪费）
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 本地没 SDK，编不了；先把最容易犯的「漏 import 扩展函数」这类错筛一遍，
      # 免得编译到一半才报一堆 Unresolved reference。
      - name: 静态体检（漏 import / 资源清单）
        run: python3 tools/lint_imports.py

      - name: 编译
        run: ./gradlew assembleDebug --stacktrace

      - name: 报告产物大小
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: PiAgent-debug
          path: app/build/outputs/apk/debug/*.apk
          # 没产物就直接失败，别给一个空的 artifact
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ 发版
  publish-release:
    name: 发布到 GitHub Release
    needs: build-debug
    runs-on: ubuntu-latest
    # PR 不发版 —— 否则每个 PR 都往 Releases 里塞一个包
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 取回 APK
        uses: actions/download-artifact@v4
        with:
          name: PiAgent-debug
          path: apk

      - name: 定版本号与标签
        id: meta
        run: |
          set -euo pipefail
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # 主分支的每次推送都覆盖同一个 nightly：Releases 页面始终只有一条，
            # 而且下载链接固定，不用每次翻构建记录找包。
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=Nightly ${version} (#${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "apk_name=PiAgent-${version}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          mv apk/*.apk "apk/${APK_NAME}"

          cat > notes.md <<EOF
          自动构建的 debug 包，未签名（可装，但只能靠 USB 调试安装）。

          - 版本：${VERSION}
          - 构建号：#${GITHUB_RUN_NUMBER}
          - 提交：${GITHUB_SHA}
          - 工作流：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          # 去掉行首缩进（heredoc 保留了缩进）
          sed -i 's/^[[:space:]]*//' notes.md

          if [ "${PRERELEASE}" = "true" ]; then
            # 滚动更新：先删旧的再建，保证同一个 tag 下只有一份产物。
            # 只在这条分支做，正式标签绝不删 —— 标签是历史，删了就找不回来。
            gh release delete "${TAG}" --yes 2>/dev/null || true
            gh release create "${TAG}" "apk/${APK_NAME}" \
              --title "${TITLE}" --prerelease --target "${GITHUB_SHA}" --notes-file notes.md
          else
            gh release create "${TAG}" "apk/${APK_NAME}" \
              --title "${TITLE}" --notes-file notes.md
          fi

          echo "::notice::已发布 ${TAG} → $(gh release view "${TAG}" --json url -q .url)"
