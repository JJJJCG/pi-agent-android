name: Android CI

# 什么时候跑：
#   · 提 PR                 → 编 release 做编译校验
#   · push 到主分支          → 编 release 并发 nightly
#   · 打 v 开头的标签        → 编 release 并发正式 Release（非预发布）
#   · 手动点一下就跑（Actions 页面上的 Run workflow）
on:
  push:
  pull_request:
  workflow_dispatch:

# 同一条分支上的旧任务自动取消，别浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 构建本身只读；发 Release 那一步单独要写权限
permissions:
  contents: read

jobs:
  # ---------------------------------------------------- 发版用的 release 构建
  build:
    name: 构建 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 确认端侧语音资源就位
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() { [ -e "$1" ] || { echo "缺少：$1"; missing=1; }; }
          check app/src/main/assets/silero_vad.onnx
          check app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          check app/src/main/assets/kws/tokens.txt
          ls app/src/main/assets/kws/encoder*.onnx >/dev/null 2>&1 || { echo "缺少：encoder*.onnx"; missing=1; }

          if [ "$missing" -eq 1 ]; then
            echo "::group::联网拉取端侧资源"
            python3 tools/fetch_assets.py --abis arm64-v8a
            echo "::endgroup::"
          else
            echo "资源齐备，跳过下载。"
          fi

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 静态体检（漏 import / 资源清单）
        run: python3 tools/lint_imports.py

      # 签名（可选）：仓库配了 SIGNING_KEYSTORE_BASE64 等 secret 就解码并注入
      # 环境变量，Gradle 据此给 release 包签名；没配则出未签名 release（仍可编）。
      # 这步始终运行，缺密钥时直接跳过，不靠 step 级 if 判断。
      - name: 准备签名密钥（可选）
        env:
          B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SP: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$B64" ]; then
            echo "未配置正式签名密钥，使用仓库内 nightly 固定密钥签名。"
            exit 0
          fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          {
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/keystore.jks"
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KP"
            echo "SIGNING_STORE_PASSWORD=$SP"
          } >> "$GITHUB_ENV"

      - name: 编译 release
        run: ./gradlew assembleRelease --stacktrace

      - name: 报告产物大小
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: PiAgent-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ 发版
  publish-release:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # PR 不发版 —— 否则每个 PR 都往 Releases 里塞一个包
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 取回 APK
        uses: actions/download-artifact@v4
        with:
          name: PiAgent-release
          path: apk

      - name: 定版本号与标签
        id: meta
        run: |
          set -euo pipefail
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # 主分支的每次推送都覆盖同一个 nightly：Releases 页面始终只有一条，
            # 而且下载链接固定，不用每次翻构建记录找包。
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=Nightly ${version} (#${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "apk_name=PiAgent-${version}.apk" >> "$GITHUB_OUTPUT"

      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          VERSION: ${{ steps.meta.outputs.version }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          mv apk/*.apk "apk/${APK_NAME}"

          {
            echo "自动构建的 Release 包（已开启 R8 混淆 + 资源收缩）："
            echo "调试页与调试日志已从安装包中移除，体积更小、不可被调试。"
            echo ""
            echo "- 版本：${VERSION}"
            echo "- 构建号：#${GITHUB_RUN_NUMBER}"
            echo "- 提交：${GITHUB_SHA}"
            echo "- 工作流：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "签名说明：本包使用仓库内置的 nightly 固定密钥签名，可直接安装，"
            echo "且后续版本可覆盖升级；配置 SIGNING_KEYSTORE_BASE64 等 secret 后，"
            echo "构建会自动改用正式密钥签名（届时需卸载重装一次）。"
          } > notes.md

          if [ "${PRERELEASE}" = "true" ]; then
            # 滚动更新：先删旧的再建，保证同一个 tag 下只有一份产物。
            # 只在这条分支做，正式标签绝不删 —— 标签是历史，删了就找不回来。
            gh release delete "${TAG}" --yes 2>/dev/null || true
            gh release create "${TAG}" "apk/${APK_NAME}" \
              --title "${TITLE}" --prerelease --target "${GITHUB_SHA}" --notes-file notes.md
          else
            gh release create "${TAG}" "apk/${APK_NAME}" \
              --title "${TITLE}" --notes-file notes.md
          fi

          echo "::notice::已发布 ${TAG} → $(gh release view "${TAG}" --json url -q .url)"
